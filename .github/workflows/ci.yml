name: CI
on:
  push:
  pull_request:
jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make check
  student-oci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t eduposix-student:test .
      - run: docker run --rm eduposix-student:test student-env-info
      - run: docker run --rm -v "$PWD:/course" eduposix-student:test student-check
